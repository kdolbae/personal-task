function mobileCrane(boomLen, mat, scaleK = 1) {

  const tipGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const line = new THREE.Line(tipGeo, matCable); scene.add(line);
  const hook = new THREE.Mesh(new THREE.BoxGeometry(0.6 * k, 0.9 * k, 0.4 * k), matCraneR); hook.castShadow = true; scene.add(hook);

function spray(centers, t, spread = 0.9) {

const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

function camKey(keys, t) {   // keys: [time, pos[3], target[3], fov]
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const A = keys[i], B = keys[i + 1]; const k = sm((t - A[0]) / Math.max(0.001, B[0] - A[0]));
  camera.position.set(lerp(A[1][0], B[1][0], k), lerp(A[1][1], B[1][1], k), lerp(A[1][2], B[1][2], k));
  camera.lookAt(lerp(A[2][0], B[2][0], k), lerp(A[2][1], B[2][1], k), lerp(A[2][2], B[2][2], k));
  camera.fov = lerp(A[3], B[3], k); camera.updateProjectionMatrix();

function tag(el, obj, txt, dy = 4.6) {
